name: Continuous Integration

on:
  pull_request: null
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    env:
      SYMFONY_REQUIRE: ${{ matrix.symfony-version }}
    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.2'
          - '7.3'
          - '7.4'
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
        symfony-version:
          - 4.4.*
          - 5.*
          - 6.*
        dependencies:
          - highest
          - lowest
        exclude:
          - php: '7.2'
            symfony-version: 6.*
            dependencies: highest
          - php: '7.3'
            symfony-version: 6.*
            dependencies: highest
          - php: '7.4'
            symfony-version: 6.*
            dependencies: highest
          - php: '7.2'
            symfony-version: 6.*
            dependencies: lowest
          - php: '7.3'
            symfony-version: 6.*
            dependencies: lowest
          - php: '7.4'
            symfony-version: 6.*
            dependencies: lowest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@728c6c6b8cf02c2e48117716a91ee48313958a19 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: flex

      - name: Install dependencies
        uses: ramsey/composer-install@1919f6c305aea6ab10e6181a8ddf72317ad77e0e # v2
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: --prefer-dist
